# Generated by scripts/render.py from config/site.json. Edit the config, not this file.
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-1node
  namespace: runai-nvis-validation
  labels:
    project: "nvis-validation"
    app.kubernetes.io/part-of: "humana-b300-validation"
    test: "smoke"
    node: "ANY"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        project: "nvis-validation"
        app.kubernetes.io/part-of: "humana-b300-validation"
        test: "smoke"
        node: "ANY"
    spec:
      schedulerName: runai-scheduler
      restartPolicy: Never
      containers:
      - name: test
        image: nvcr.io/nvidia/pytorch:26.04-py3
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        command: ["/bin/bash", "-lc"]
        args:
        - |
          echo "RUN=smoke NODE=$(hostname) DATE=$(date -u +%FT%TZ)"
          nvidia-smi -L
          GPUS=$(nvidia-smi -L | grep -c '^GPU')
          ls -l /usr/local/bin/all_reduce_perf_mpi
          which mpirun
          echo "gpus=${GPUS}"
          if [ "$GPUS" -eq 8 ]; then echo "RESULT=PASS"; else echo "RESULT=FAIL"; exit 1; fi
        env:
        - name: NCCL_DEBUG
          value: "WARN"
        resources:
          limits:
            nvidia.com/gpu: 8
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
