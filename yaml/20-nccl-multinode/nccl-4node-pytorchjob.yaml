# Generated by scripts/render.py. 4-node NCCL all_reduce with torchrun. Needs no sshd or MPI launcher, so it works air-gapped.
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: nccl-4node-torch
  namespace: runai-nvis-validation
  labels:
    project: "nvis-validation"
    app.kubernetes.io/part-of: "humana-b300-validation"
    test: "nccl-4node"
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          labels:
            project: "nvis-validation"
            app.kubernetes.io/part-of: "humana-b300-validation"
            test: "nccl-4node"
          annotations:
            k8s.v1.cni.cncf.io/networks: "default/p0-r0,default/p0-r1,default/p0-r2,default/p0-r3,default/p0-r4,default/p0-r5,default/p0-r6,default/p0-r7,default/p1-r0,default/p1-r1,default/p1-r2,default/p1-r3,default/p1-r4,default/p1-r5,default/p1-r6,default/p1-r7"
        spec:
          schedulerName: runai-scheduler
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                    - dgx001
                    - dgx002
                    - dgx003
                    - dgx004
          containers:
          - name: pytorch
            image: nvcr.io/nvidia/pytorch:26.04-py3
            imagePullPolicy: IfNotPresent
            securityContext:
              runAsUser: 0
              capabilities:
                add: ["NET_ADMIN","NET_RAW","IPC_LOCK","SYS_RESOURCE"]
            command: ["/bin/bash", "-lc"]
            args:
            - |
              echo "RUN=nccl-4node-torch NODES=4 RANKS=32 NODE=$(hostname) DATE=$(date -u +%FT%TZ)"
              export LD_LIBRARY_PATH=/opt/hpcx/nccl_spectrum-x_plugin/lib:/usr/local/lib:$LD_LIBRARY_PATH
              cat > /tmp/nccl_bench.py <<'PYEOF'
              import os, time, torch, torch.distributed as dist
              dist.init_process_group("nccl")
              rank, world = dist.get_rank(), dist.get_world_size()
              torch.cuda.set_device(int(os.environ.get("LOCAL_RANK", 0)))
              maxb = os.environ.get("BENCH_MAX", "16G")
              mult = {"K": 1 << 10, "M": 1 << 20, "G": 1 << 30}
              top = int(maxb[:-1]) * mult[maxb[-1]] if maxb[-1] in mult else int(maxb)
              sizes, s = [], 8
              while s <= top:
                  sizes.append(s)
                  s *= 2
              warm, iters, bws, bad = 2, 10, [], 0
              if rank == 0:
                  print("# torch.distributed all_reduce bench: ranks=%d (in-place; columns duplicated for parser compatibility)" % world, flush=True)
                  print("#  size count type redop root time algbw busbw #wrong time algbw busbw #wrong", flush=True)
              for size in sizes:
                  n = max(size // 4, 1)
                  x = torch.ones(n, dtype=torch.float32, device="cuda")
                  for _ in range(warm):
                      dist.all_reduce(x)
                  torch.cuda.synchronize()
                  ok = abs(x[0].item() - float(world) ** warm) <= 1e-3 * float(world) ** warm
                  bad += 0 if ok else 1
                  dist.barrier()
                  t0 = time.perf_counter()
                  for _ in range(iters):
                      dist.all_reduce(x)
                  torch.cuda.synchronize()
                  dt = (time.perf_counter() - t0) / iters
                  alg = size / dt / 1e9
                  bus = alg * 2 * (world - 1) / world
                  bws.append(bus)
                  if rank == 0:
                      us = dt * 1e6
                      w = 0 if ok else 1
                      print("%d %d float sum -1 %.2f %.2f %.2f %d %.2f %.2f %.2f %d" % (size, n, us, alg, bus, w, us, alg, bus, w), flush=True)
                  del x
              if rank == 0:
                  print("# Out of bounds values : %d %s" % (bad, "OK" if bad == 0 else "FAILED"), flush=True)
                  print("# Avg bus bandwidth    : %.3f" % (sum(bws) / len(bws)), flush=True)
              dist.destroy_process_group()
              PYEOF
              export BENCH_MAX=16G
              torchrun --nnodes=4 --nproc_per_node=8 \
                --node_rank=${PET_NODE_RANK:-${RANK:-0}} \
                --master_addr=${MASTER_ADDR} --master_port=${MASTER_PORT:-29500} \
                /tmp/nccl_bench.py 2>&1 | tee /tmp/nccl.log
              rc=${PIPESTATUS[0]}
              echo "exit status: $rc"
              echo "SPCX_ASSIGNED=$(grep -c 'Assigned NET plugin SPCX' /tmp/nccl.log)"
              if [ "$rc" -eq 0 ]; then echo "RESULT=DONE"; else echo "RESULT=FAIL reason=torchrun_rc_${rc}"; fi
              exit $rc
            env:
            - name: NCCL_DEBUG
              value: "INFO"
            - name: NCCL_DEBUG_SUBSYS
              value: "INIT,NET"
            - name: NCCL_NET_PLUGIN
              value: "spcx"
            - name: NCCL_IB_HCA
              value: "roce_"
            - name: NCCL_SOCKET_IFNAME
              value: "eth0"
            - name: UCX_TLS
              value: "tcp"
            - name: NCCL_IB_TC
              value: "96"
            - name: NCCL_CROSS_NIC
              value: "0"
            - name: NCCL_IB_MERGE_NICS
              value: "0"
            - name: NCCL_NET_MERGE_LEVEL
              value: "PIX"
            - name: NCCL_NCHANNELS_PER_NET_PEER
              value: "4"
            - name: NCCL_P2P_NET_CHUNKSIZE
              value: "262144"
            resources:
              limits:
                nvidia.com/gpu: 8
                nvidia.com/p0-r0: "1"
                nvidia.com/p0-r1: "1"
                nvidia.com/p0-r2: "1"
                nvidia.com/p0-r3: "1"
                nvidia.com/p0-r4: "1"
                nvidia.com/p0-r5: "1"
                nvidia.com/p0-r6: "1"
                nvidia.com/p0-r7: "1"
                nvidia.com/p1-r0: "1"
                nvidia.com/p1-r1: "1"
                nvidia.com/p1-r2: "1"
                nvidia.com/p1-r3: "1"
                nvidia.com/p1-r4: "1"
                nvidia.com/p1-r5: "1"
                nvidia.com/p1-r6: "1"
                nvidia.com/p1-r7: "1"
            volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 32Gi
    Worker:
      replicas: 3
      restartPolicy: Never
      template:
        metadata:
          labels:
            project: "nvis-validation"
            app.kubernetes.io/part-of: "humana-b300-validation"
            test: "nccl-4node"
          annotations:
            k8s.v1.cni.cncf.io/networks: "default/p0-r0,default/p0-r1,default/p0-r2,default/p0-r3,default/p0-r4,default/p0-r5,default/p0-r6,default/p0-r7,default/p1-r0,default/p1-r1,default/p1-r2,default/p1-r3,default/p1-r4,default/p1-r5,default/p1-r6,default/p1-r7"
        spec:
          schedulerName: runai-scheduler
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
