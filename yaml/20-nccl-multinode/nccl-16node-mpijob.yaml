# Generated by scripts/render.py. Multi-node NCCL over Spectrum-X RoCE: 16 nodes x 8 GPUs = 128 ranks.
# Pattern from the Run:ai 2.23 BCM validation page (roce-nccl-test.yaml), which passed on this cluster.
# Needs an image that contains sshd (docs/AIR-GAP-SSH.md). Without one, use the PyTorchJob variant.
apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: nccl-16node-mpi
  namespace: runai-nvis-validation
  labels:
    project: "nvis-validation"
    app.kubernetes.io/part-of: "humana-b300-validation"
    test: "nccl-16node"
spec:
  slotsPerWorker: 8
  launcherCreationPolicy: WaitForWorkersReady
  runPolicy:
    cleanPodPolicy: Running
  sshAuthMountPath: /root/.ssh
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        metadata:
          labels:
            project: "nvis-validation"
            app.kubernetes.io/part-of: "humana-b300-validation"
            test: "nccl-16node"
        spec:
          schedulerName: runai-scheduler
          restartPolicy: OnFailure
          containers:
          - name: mpi-launcher
            image: nvcr.io/nvidia/pytorch:26.04-py3
            securityContext:
              runAsUser: 0
            env:
            - name: OMPI_ALLOW_RUN_AS_ROOT
              value: "1"
            - name: OMPI_ALLOW_RUN_AS_ROOT_CONFIRM
              value: "1"
            command: ["/bin/bash", "-lc"]
            args:
            - |
              echo "RUN=nccl-16node-mpi NODES=16 RANKS=128 DATE=$(date -u +%FT%TZ)"
              export LD_LIBRARY_PATH=/opt/hpcx/nccl_spectrum-x_plugin/lib:/usr/local/lib:$LD_LIBRARY_PATH
              mpirun --allow-run-as-root \
                --mca plm_rsh_args "-p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
                --bind-to core --map-by ppr:8:node -np 128 \
                -x NCCL_DEBUG=INFO -x NCCL_DEBUG_SUBSYS=INIT,NET -x NCCL_NET_PLUGIN=spcx -x LD_LIBRARY_PATH \
                -x NCCL_IB_HCA=roce_ -x NCCL_SOCKET_IFNAME=eth0 -x UCX_TLS=tcp -x NCCL_IB_TC=96 -x NCCL_CROSS_NIC=0 \
                -x NCCL_IB_MERGE_NICS=0 -x NCCL_NET_MERGE_LEVEL=PIX -x NCCL_NCHANNELS_PER_NET_PEER=4 -x NCCL_P2P_NET_CHUNKSIZE=262144 \
                /usr/local/bin/all_reduce_perf_mpi -b 8 -e 16G -f 2 -g 1 -w 2 --iters 4 -c 10 2>&1 | tee /tmp/nccl.log
              rc=${PIPESTATUS[0]}
              echo "exit status: $rc"
              echo "SPCX_ASSIGNED=$(grep -c 'Assigned NET plugin SPCX' /tmp/nccl.log)"
              if [ "$rc" -eq 0 ]; then echo "RESULT=DONE"; else echo "RESULT=FAIL reason=mpirun_rc_${rc}"; fi
              exit $rc
            volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 32Gi
    Worker:
      replicas: 16
      template:
        metadata:
          labels:
            project: "nvis-validation"
            app.kubernetes.io/part-of: "humana-b300-validation"
            test: "nccl-16node"
          annotations:
            k8s.v1.cni.cncf.io/networks: "default/p0-r0,default/p0-r1,default/p0-r2,default/p0-r3,default/p0-r4,default/p0-r5,default/p0-r6,default/p0-r7,default/p1-r0,default/p1-r1,default/p1-r2,default/p1-r3,default/p1-r4,default/p1-r5,default/p1-r6,default/p1-r7"
        spec:
          schedulerName: runai-scheduler
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                    - dgx001
                    - dgx002
                    - dgx003
                    - dgx004
                    - dgx005
                    - dgx006
                    - dgx007
                    - dgx008
                    - dgx009
                    - dgx010
                    - dgx011
                    - dgx012
                    - dgx013
                    - dgx014
                    - dgx015
                    - dgx016
          containers:
          - name: mpi-worker
            image: nvcr.io/nvidia/pytorch:26.04-py3
            securityContext:
              runAsUser: 0
              capabilities:
                add: ["NET_ADMIN","NET_RAW","IPC_LOCK","SYS_RESOURCE"]
            command: ["/bin/bash", "-lc"]
            args:
            - |
              if ! command -v sshd >/dev/null 2>&1; then
                echo "sshd not in image; trying apt (fails on an air-gapped cluster - see docs/AIR-GAP-SSH.md)"
                apt-get update -qq && apt-get install -y -q openssh-server || { echo "RESULT=FAIL reason=no_sshd"; sleep 600; exit 1; }
              fi
              mkdir -p /run/sshd && ssh-keygen -A && exec /usr/sbin/sshd -De -p 2222 -o StrictModes=no
            resources:
              limits:
                nvidia.com/gpu: 8
                nvidia.com/p0-r0: "1"
                nvidia.com/p0-r1: "1"
                nvidia.com/p0-r2: "1"
                nvidia.com/p0-r3: "1"
                nvidia.com/p0-r4: "1"
                nvidia.com/p0-r5: "1"
                nvidia.com/p0-r6: "1"
                nvidia.com/p0-r7: "1"
                nvidia.com/p1-r0: "1"
                nvidia.com/p1-r1: "1"
                nvidia.com/p1-r2: "1"
                nvidia.com/p1-r3: "1"
                nvidia.com/p1-r4: "1"
                nvidia.com/p1-r5: "1"
                nvidia.com/p1-r6: "1"
                nvidia.com/p1-r7: "1"
            volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 32Gi
