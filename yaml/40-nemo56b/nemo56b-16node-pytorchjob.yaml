# Generated by scripts/render.py. NeMo 56B wrapper. NOT READY until the NeMo image and /recipe/run_nemo56b.sh are staged.
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: nemo56b-16node
  namespace: runai-nvis-validation
  labels:
    project: "nvis-validation"
    app.kubernetes.io/part-of: "humana-b300-validation"
    test: "nemo56b-16node"
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          labels:
            project: "nvis-validation"
            app.kubernetes.io/part-of: "humana-b300-validation"
            test: "nemo56b-16node"
          annotations:
            k8s.v1.cni.cncf.io/networks: "default/p0-r0,default/p0-r1,default/p0-r2,default/p0-r3,default/p0-r4,default/p0-r5,default/p0-r6,default/p0-r7,default/p1-r0,default/p1-r1,default/p1-r2,default/p1-r3,default/p1-r4,default/p1-r5,default/p1-r6,default/p1-r7"
        spec:
          schedulerName: runai-scheduler
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                    - dgx001
                    - dgx002
                    - dgx003
                    - dgx004
                    - dgx005
                    - dgx006
                    - dgx007
                    - dgx008
                    - dgx009
                    - dgx010
                    - dgx011
                    - dgx012
                    - dgx013
                    - dgx014
                    - dgx015
                    - dgx016
          containers:
          - name: pytorch
            image: nvcr.io/nvidia/nemo:25.07.01
            imagePullPolicy: IfNotPresent
            securityContext:
              runAsUser: 0
              capabilities:
                add: ["NET_ADMIN","NET_RAW","IPC_LOCK","SYS_RESOURCE"]
            command: ["/bin/bash", "-lc"]
            args:
            - |
              echo "RUN=nemo56b-16node NODE=$(hostname) DATE=$(date -u +%FT%TZ)"
              if [ ! -f /recipe/run_nemo56b.sh ]; then
                echo "RESULT=NOT_READY reason=/recipe/run_nemo56b.sh_missing (see yaml/40-nemo56b/recipe/README.txt)"
                exit 2
              fi
              export NNODES=16 NPROC_PER_NODE=8
              export NODE_RANK=${PET_NODE_RANK:-${RANK:-0}}
              export MASTER_ADDR=${MASTER_ADDR:-localhost} MASTER_PORT=${MASTER_PORT:-29500}
              bash /recipe/run_nemo56b.sh 2>&1 | tee /tmp/nemo.log
              rc=${PIPESTATUS[0]}
              echo "exit status: $rc"
              if [ "$rc" -eq 0 ]; then echo "RESULT=DONE"; else echo "RESULT=FAIL reason=nemo_rc_${rc}"; fi
              exit $rc
            env:
            - name: NCCL_DEBUG
              value: "INFO"
            - name: NCCL_DEBUG_SUBSYS
              value: "INIT,NET"
            - name: NCCL_NET_PLUGIN
              value: "spcx"
            - name: NCCL_IB_HCA
              value: "roce_"
            - name: NCCL_SOCKET_IFNAME
              value: "eth0"
            - name: UCX_TLS
              value: "tcp"
            - name: NCCL_IB_TC
              value: "96"
            - name: NCCL_CROSS_NIC
              value: "0"
            - name: NCCL_IB_MERGE_NICS
              value: "0"
            - name: NCCL_NET_MERGE_LEVEL
              value: "PIX"
            - name: NCCL_NCHANNELS_PER_NET_PEER
              value: "4"
            - name: NCCL_P2P_NET_CHUNKSIZE
              value: "262144"
            - name: NCCL_NVLS_ENABLE
              value: "0"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: TOKENIZERS_PARALLELISM
              value: "False"
            - name: PYTHONUNBUFFERED
              value: "1"
            resources:
              limits:
                nvidia.com/gpu: 8
                nvidia.com/p0-r0: "1"
                nvidia.com/p0-r1: "1"
                nvidia.com/p0-r2: "1"
                nvidia.com/p0-r3: "1"
                nvidia.com/p0-r4: "1"
                nvidia.com/p0-r5: "1"
                nvidia.com/p0-r6: "1"
                nvidia.com/p0-r7: "1"
                nvidia.com/p1-r0: "1"
                nvidia.com/p1-r1: "1"
                nvidia.com/p1-r2: "1"
                nvidia.com/p1-r3: "1"
                nvidia.com/p1-r4: "1"
                nvidia.com/p1-r5: "1"
                nvidia.com/p1-r6: "1"
                nvidia.com/p1-r7: "1"
            volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: recipe
              mountPath: /recipe
          volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 32Gi
          - name: recipe
            hostPath:
              path: /vast/validation/nemo56b
              type: DirectoryOrCreate
    Worker:
      replicas: 15
      restartPolicy: Never
      template:
