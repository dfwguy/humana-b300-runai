                    - dgx004
                    - dgx005
                    - dgx006
                    - dgx007
                    - dgx008
                    - dgx009
                    - dgx010
                    - dgx011
                    - dgx012
                    - dgx013
                    - dgx014
                    - dgx015
                    - dgx016
          containers:
          - name: pytorch
            image: nvcr.io/nvidia/nemo:25.07.01
            imagePullPolicy: IfNotPresent
            securityContext:
              runAsUser: 0
              capabilities:
