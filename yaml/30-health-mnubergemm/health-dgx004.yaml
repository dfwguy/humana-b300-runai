  labels:
    project: "nvis-validation"
    app.kubernetes.io/part-of: "humana-b300-validation"
    test: "health"
    node: "dgx004"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        project: "nvis-validation"
        app.kubernetes.io/part-of: "humana-b300-validation"
        test: "health"
        node: "dgx004"
    spec:
      schedulerName: runai-scheduler
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: dgx004
      containers:
      - name: test
        image: nvcr.io/nvidia/pytorch:26.04-py3
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        command: ["/bin/bash", "-lc"]
        args:
        - |
          echo "RUN=health-dgx004 NODE=$(hostname) DATE=$(date -u +%FT%TZ)"
          nvidia-smi -L
          GPUS=$(nvidia-smi -L | grep -c '^GPU')
          echo "gpus=${GPUS} cores=$(nproc) mem_kb=$(awk '/MemTotal/{print $2}' /proc/meminfo)"
          nvidia-smi --query-gpu=index,name,pci.bus_id,temperature.gpu,power.draw,clocks.sm,clocks.max.sm,memory.total,ecc.errors.uncorrected.volatile.total --format=csv
